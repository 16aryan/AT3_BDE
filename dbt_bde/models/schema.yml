version: 2

models:
  - name: fact_listings
    description: "Gold fact table containing listing metrics, foreign keys, and revenue calculations"
    columns:
      - name: fact_listing_id
        description: "Surrogate key for the fact grain (listing_id - scraped_date)"
        tests:
          - unique
          - not_null
      - name: listing_id
        description: "Natural key of the listing"
        tests:
          - not_null
      - name: scraped_date
        description: "Point-in-time date of the scrape"
        tests:
          - not_null
      - name: price
        description: "Sanitized nightly price in AUD"
        tests:
          - not_null

  - name: dim_property
    description: "SCD Type 2 dimension for property specifications"
    columns:
      - name: property_sk
        description: "Surrogate hash key generated by dbt snapshot"
        tests:
          - unique
          - not_null
      - name: listing_id
        description: "Natural key of the property listing"
        tests:
          - not_null

  - name: dim_host
    description: "SCD Type 2 dimension for host profiles"
    columns:
      - name: host_sk
        description: "Surrogate hash key generated by dbt snapshot"
        tests:
          - unique
          - not_null
      - name: host_id
        description: "Natural key of the host"
        tests:
          - not_null

  - name: dim_suburb
    description: "SCD Type 2 dimension mapping 4,520 NSW suburbs and LGAs"
    columns:
      - name: suburb_sk
        description: "Surrogate hash key"
        tests:
          - unique
          - not_null
      - name: suburb_name
        description: "Name of the suburb or LGA"
        tests:
          - not_null

  - name: dim_lga
    description: "Gold dimension for all 128 Local Government Areas in NSW"
    columns:
      - name: lga_sk
        description: "Surrogate MD5 hash key of LGA code"
        tests:
          - unique
          - not_null
      - name: lga_code
        description: "Numeric 5-digit LGA code"
        tests:
          - unique
          - not_null

  - name: dm_listing_neighbourhood
    description: "Datamart 1: Monthly neighbourhood metrics with MoM active listings growth"
    columns:
      - name: listing_neighbourhood
        tests:
          - not_null
      - name: month_year
        tests:
          - not_null

  - name: dm_property_type
    description: "Datamart 2: Performance metrics partitioned by property type, room type, accommodates, and month"
    columns:
      - name: property_type
        tests:
          - not_null
      - name: month_year
        tests:
          - not_null

  - name: dm_host_neighbourhood
    description: "Datamart 3: Host distribution and estimated revenue mapped to host LGA location"
    columns:
      - name: host_neighbourhood_lga
        tests:
          - not_null
      - name: month_year
        tests:
          - not_null
