dbt_bde:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_USER', 'postgres') }}"
      password: "{{ env_var('DBT_PASSWORD', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_DBNAME', 'postgres') }}"
      schema: public
      sslmode: "{{ env_var('DBT_SSLMODE', 'prefer') }}"
      threads: 4
      keepalives_idle: 0
    prod:
      type: postgres
      host: "{{ env_var('DBT_PROD_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_PROD_USER', 'postgres') }}"
      password: "{{ env_var('DBT_PROD_PASSWORD', 'postgres') }}"
      port: "{{ env_var('DBT_PROD_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_PROD_DBNAME', 'postgres') }}"
      schema: public
      threads: 4
