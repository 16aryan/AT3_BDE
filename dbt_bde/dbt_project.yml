name: 'dbt_bde'
version: '1.0.0'
config-version: 2

# Profile to use from profiles.yml
profile: 'dbt_bde'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_bde:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    datamart:
      +schema: gold
      +materialized: view
